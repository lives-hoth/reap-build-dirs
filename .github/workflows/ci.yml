name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck reap-build-dirs
      - name: spec, against the binary
        run: cargo test --locked
      # Holds the bash script to the same spec while it is being replaced.
      - name: spec, against the bash script
        run: REAP_BIN="$PWD/reap-build-dirs" cargo test --locked

[package]
name = "reap-build-dirs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Delete stale cargo and Terraform build output from worktrees so they can't fill your disk"
license = "MIT"
repository = "https://github.com/lives-hoth/reap-build-dirs"
readme = "README.md"
keywords = ["cargo", "terraform", "worktree", "disk", "cleanup"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2.2"
filetime = "0.2"
tempfile = "3.27"
